app-id: com.darhon.syncbackup
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: syncbackup
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --share=network
  - --filesystem=host
cleanup:
  - /include
  - /lib/cmake
  - /mkspecs
  - /share/man
modules:
  - name: rsync
    buildsystem: autotools
    config-opts:
      - --disable-zstd
      - --disable-xxhash
      - --disable-md2man
    sources:
      - type: git
        url: https://github.com/WayneD/rsync.git
        tag: v3.5.0
        commit: 471e17dc0d68233db84db11be82c9f62f4661214

  # Required by: ksshaskpass
  - name: qt6keychain
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_WITH_QT6=ON
      - -DBUILD_TRANSLATIONS=OFF
      - -DBUILD_TEST_APPLICATION=OFF
    sources:
      - type: git
        url: https://github.com/frankosterfeld/qtkeychain.git
        tag: 0.17.0
        commit: 875f77d9f61bd97fd84cca47ce3bc71186dfbd09

  - name: ksshaskpass
    buildsystem: cmake-ninja
    cleanup:
      - /share/applications
    sources:
      - type: git
        url: https://github.com/KDE/ksshaskpass.git
        tag: v6.7.4
        commit: 34a7bc5c348fb0a5551f5acde443c5dc3a8474a5

  - name: syncbackup
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: git
        url: https://github.com/DarhonSoftware/syncBackup.git
        tag: v2.1.5
        commit: 2d346d8e3e4335feeae72217d37812b40f3880b0

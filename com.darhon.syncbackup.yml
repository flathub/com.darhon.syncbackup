app-id: com.darhon.syncbackup
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: syncbackup
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --share=network
  - --filesystem=host
cleanup:
  - /include
  - /lib/cmake
  - /mkspecs
  - /share/man
modules:
  - name: rsync
    buildsystem: autotools
    config-opts:
      - --disable-zstd
      - --disable-xxhash
      - --disable-md2man
    sources:
      - type: git
        url: https://github.com/WayneD/rsync.git
        tag: v3.4.4
        commit: f26f747b8017b321d3776becc69f330dd889fa21

  # Required by: ksshaskpass
  - name: qt6keychain
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_WITH_QT6=ON
      - -DBUILD_TRANSLATIONS=OFF
      - -DBUILD_TEST_APPLICATION=OFF
    sources:
      - type: git
        url: https://github.com/frankosterfeld/qtkeychain.git
        tag: 0.16.0
        commit: aa6da344e1a20b9194e12bace3665caeea6b6304

  - name: ksshaskpass
    buildsystem: cmake-ninja
    cleanup:
      - /share/applications
    sources:
      - type: git
        url: https://github.com/KDE/ksshaskpass.git
        tag: v6.6.91
        commit: 38b996a3ac0d8528001e96a4bf2ffd8322bfcff5

  - name: syncbackup
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: git
        url: https://github.com/DarhonSoftware/syncBackup.git
        tag: v2.1.5
        commit: 6b5a29070295af3ac7b6b6ba556ee42b1c90b9eb
